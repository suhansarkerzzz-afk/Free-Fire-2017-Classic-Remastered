name: Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          customParameters: -executeMethod AndroidBuildSetup.BuildAndroid

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeFire2017ClassicRemastered-Android-APK
          path: Build/Android/FreeFire2017ClassicRemastered.apk
          if-no-files-found: error
          retention-days: 14
