name: Godot Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "GodotPort/**"
      - ".github/workflows/godot-android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Validate and export Godot Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android export settings
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$RUNNER_TEMP/android"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import Godot project
        run: godot --headless --editor --path GodotPort --quit

      - name: Validate project runtime and scripts
        run: godot --headless --path GodotPort --quit-after 5

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p Build/Android
          godot --headless --path GodotPort --export-debug "Android" "$GITHUB_WORKSPACE/Build/Android/FreeFire2017ClassicRemastered-Godot.apk"
          test -s Build/Android/FreeFire2017ClassicRemastered-Godot.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFire2017ClassicRemastered-Godot-Android-APK
          path: Build/Android/FreeFire2017ClassicRemastered-Godot.apk
          if-no-files-found: error
          retention-days: 14
